<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CDN de Bootstrap (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CDN de Bootstrap (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>{% block title %}Meditrack{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <body style="background-color: #bda982;"></body>
    <header>
        <nav aria-label="Navegación principal">
        <a href="{{ url_for('main.dashboard') }}">Meditrack</a>
            <a href="{{ url_for('main.listarMeds') }}">Medicamentos</a> 
            <!-- <a href="{{ url_for('gestion.crear_medicamento') }}">Agregar medicamento</a> -->
            <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{{ url_for('gestion.crear_medicamento') }}">Agregar medicamento</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Buscar y listar medicamentos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Detalles del medicamento</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
